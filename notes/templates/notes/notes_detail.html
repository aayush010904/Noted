
{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="row">
    <div class="col">
        <div class="card-header">Note Details</div>
        <div class="card-body">
            <h1>{{note.title}}</h1>
            <p>{{note.text}}</p>
        </div>
        <div class="card-footer">
            <a href="{% url 'notes.list' %}" class="btn">Back</a>
            <a href="{% url 'notes.update' pk=note.id %}" class="btn">Edit</a>
            <a href="{% url 'notes.delete' pk=note.id %}" class="btn">Delete</a>
        </div>
    </div>
</div>

{% endblock  %}
