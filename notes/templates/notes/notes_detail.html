
{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="note-detail">
    <div style="background: var(--surface); border: 1px solid var(--border-color); border-radius: 0.75rem; padding: 2rem; box-shadow: var(--shadow-sm);">
        <h1 style="margin: 0 0 1.5rem; font-size: 2rem; font-weight: 600; line-height: 1.3;">{{ note.title }}</h1>
        
        <div class="note-detail-content">{{ note.text }}</div>
        
        {% if note.tags.all %}
            <div class="note-tags" style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--border-color);">
                {% for tag in note.tags.all %}
                    <span class="tag-chip">#{{ tag.name }}</span>
                {% endfor %}
            </div>
        {% endif %}
        
        <div class="card-footer">
            <a href="{% url 'notes.list' %}" class="btn btn-ghost">← Back</a>
            <a href="{% url 'notes.update' pk=note.id %}" class="btn btn-primary">Edit</a>
            <a href="{% url 'notes.delete' pk=note.id %}" class="btn" style="background: var(--danger); color: white;">Delete</a>
        </div>
    </div>
</div>

{% endblock  %}
