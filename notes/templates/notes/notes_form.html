{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="note-editor-container">
    <div class="note-editor-header">
        <a href="{% url 'notes.list' %}" class="editor-back-btn">← Back to Notes</a>
    </div>
    
    <form action="" method="post" class="note-editor-form">
        {% csrf_token %}
        
        <div class="editor-wrapper">
            <input 
                type="text" 
                name="title" 
                placeholder="Untitled note"
                class="editor-title"
                value="{{ form.instance.title }}"
                required
            >
            
            <textarea 
                name="text" 
                class="editor-content"
                placeholder="Start typing..."
            >{{ form.instance.text }}</textarea>
            
            <div class="editor-meta">
                <div class="editor-tags">
                    <label>Tags</label>
                    <input 
                        type="text" 
                        name="tags_input" 
                        placeholder="Add tags separated by commas"
                        class="editor-tags-input"
                        value="{% if form.instance.pk %}{{ form.tags_input.value }}{% endif %}"
                    >
                </div>
            </div>
        </div>
        
        <div class="editor-footer">
            <button type="submit" class="btn btn-primary">Save Note</button>
            <a href="{% url 'notes.list' %}" class="btn btn-ghost">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
