services:
  - type: web
    name: noted
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn noted.wsgi:application --log-file -
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: noted.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: noted-db
          property: connectionString

databases:
  - name: noted-db
    plan: free
