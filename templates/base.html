{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noted</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="topbar">
        <a href="{% url 'home' %}" class="brand">
            <span class="brand-mark">N</span>
            <span class="brand-title">Noted</span>
        </a>
        <nav class="topnav">
            {% if user.is_authenticated %}
                <a href="{% url 'notes.list' %}" class="btn btn-ghost">Your Notes</a>
                <a href="{% url 'notes.new' %}" class="btn btn-primary">+ New Note</a>
                <form action="{% url 'logout' %}" method="post" class="inline-form">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-ghost">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-ghost">Login</a>
                <a href="{% url 'signup' %}" class="btn btn-primary">Sign Up</a>
            {% endif %}
        </nav>
    </header>
    <main class="page-shell">
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
